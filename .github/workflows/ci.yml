name: Build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Test director logic
        run: dotnet run --project tests/ValheimBroadcaster.Core.Tests/ValheimBroadcaster.Core.Tests.csproj --configuration Release

  streaming:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Install test encoder and receiver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Windows test encoder and receiver
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Use the real process: killing a Chocolatey launcher shim can leave its
          # FFmpeg child holding the redirected pipes open.
          $binary = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Actual FFmpeg executable not found' }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using FFmpeg directory: $($binary.Directory.FullName)"
      - name: Test buffers and real RTMP audio/video loopback
        timeout-minutes: 3
        run: dotnet run --project tests/ValheimBroadcaster.Streaming.Tests --configuration Release -warnaserror

  plugin:
    needs: [core, streaming]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Fetch pinned real compilation references
        run: python3 scripts/fetch-build-references.py --output "$RUNNER_TEMP/valheim-build-references"
      - name: Audit observer assumptions against real game metadata
        run: |
          dotnet build tests/ValheimBroadcaster.Hooks.Tests --configuration Release -warnaserror \
            -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
          dotnet tests/ValheimBroadcaster.Hooks.Tests/bin/Release/net8.0/ValheimBroadcaster.Hooks.Tests.dll \
            "$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Build plugin against Valheim 1.0.21 and BepInEx 5.4.23.2
        run: >-
          dotnet build src/ValheimBroadcaster.Plugin/ValheimBroadcaster.Plugin.csproj
          --configuration Release -warnaserror
          -p:ValheimManagedDir="$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed"
          -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
      - name: Build observer server companion
        run: >-
          dotnet build src/ValheimBroadcaster.Server/ValheimBroadcaster.Server.csproj
          --configuration Release -warnaserror
          -p:ValheimManagedDir="$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed"
          -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
      - name: Stage only our plugin and core DLLs
        run: |
          mkdir -p artifacts/ValheimBroadcaster
          cp src/ValheimBroadcaster.Plugin/bin/Release/net48/ValheimBroadcaster.dll artifacts/ValheimBroadcaster/
          cp src/ValheimBroadcaster.Core/bin/Release/netstandard2.0/ValheimBroadcaster.Core.dll artifacts/ValheimBroadcaster/
      - name: Upload test build (not a validated game release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valheim-broadcaster-${{ github.sha }}
          path: |
            artifacts/ValheimBroadcaster/ValheimBroadcaster.dll
            artifacts/ValheimBroadcaster/ValheimBroadcaster.Core.dll
          if-no-files-found: error
          retention-days: 14
      - name: Stage server companion separately
        run: |
          mkdir -p server-artifacts/ValheimBroadcaster
          cp src/ValheimBroadcaster.Server/bin/Release/net48/ValheimBroadcaster.Server.dll server-artifacts/ValheimBroadcaster/
          cp src/ValheimBroadcaster.Core/bin/Release/netstandard2.0/ValheimBroadcaster.Core.dll server-artifacts/ValheimBroadcaster/
      - name: Upload server test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valheim-broadcaster-server-${{ github.sha }}
          path: server-artifacts/
          if-no-files-found: error
          retention-days: 14
