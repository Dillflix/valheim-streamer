name: Build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Test director logic
        run: dotnet run --project tests/ValheimBroadcaster.Core.Tests/ValheimBroadcaster.Core.Tests.csproj --configuration Release
      - name: Test synchronized footage review
        run: python3 -m unittest discover -s tests/footage-review -v
      - name: Build and exercise standalone evidence replay
        run: |
          dotnet publish tools/ValheimBroadcaster.Replay --configuration Release -warnaserror --output replay-artifacts
          dotnet replay-artifacts/ValheimBroadcaster.Replay.dll tests/fixtures/scenic-evidence/competing-deadlines.jsonl
          dotnet replay-artifacts/ValheimBroadcaster.Replay.dll tests/fixtures/scenic-evidence/editorial-capture.jsonl
          cp docs/SCENIC-EVIDENCE.md replay-artifacts/README.md
          cp docs/EDITORIAL-CAPTURE.md replay-artifacts/EDITORIAL-CAPTURE.md
          cp tools/review-footage.py replay-artifacts/review-footage.py
      - name: Upload standalone replay tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ValheimBroadcaster-Replay
          path: replay-artifacts/
          if-no-files-found: error

  streaming:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Install test encoder and receiver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Windows test encoder and receiver
        if: runner.os == 'Windows'
        run: |
          # Pin the actual upstream binary instead of depending on Chocolatey's
          # live package feed or a launcher shim that can orphan its child.
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg-test'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2 -TimeoutSec 90
          $expectedHash = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedHash) { throw 'FFmpeg archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $destination
          $binary = Get-ChildItem $destination -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Actual FFmpeg executable not found' }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using FFmpeg directory: $($binary.Directory.FullName)"
      - name: Test buffers and real RTMP audio/video loopback
        timeout-minutes: 3
        run: dotnet run --project tests/ValheimBroadcaster.Streaming.Tests --configuration Release -warnaserror
      - name: Test diagnostic footage encoding, frame mapping and retention
        timeout-minutes: 3
        run: dotnet run --project tests/ValheimBroadcaster.DiagnosticCapture.Tests --configuration Release -warnaserror
      - name: Test real timelapse encoding and accelerated frame timeline
        timeout-minutes: 3
        run: dotnet run --project tests/ValheimBroadcaster.Timelapse.Tests --configuration Release -warnaserror

  plugin:
    needs: [core, streaming]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.427'
      - name: Fetch pinned real compilation references
        run: python3 scripts/fetch-build-references.py --output "$RUNNER_TEMP/valheim-build-references"
      - name: Audit observer assumptions against real game metadata
        run: |
          dotnet build tests/ValheimBroadcaster.Hooks.Tests --configuration Release -warnaserror \
            -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
          dotnet tests/ValheimBroadcaster.Hooks.Tests/bin/Release/net8.0/ValheimBroadcaster.Hooks.Tests.dll \
            "$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Prepare pinned Cinemachine runtime sources
        run: python3 scripts/fetch-cinemachine.py
      - name: Build plugin against Valheim 1.0.21 and BepInEx 5.4.23.2
        run: >-
          dotnet build src/ValheimBroadcaster.Plugin/ValheimBroadcaster.Plugin.csproj
          --configuration Release -warnaserror
          -p:ValheimManagedDir="$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed"
          -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
      - name: Build observer server companion
        run: >-
          dotnet build src/ValheimBroadcaster.Server/ValheimBroadcaster.Server.csproj
          --configuration Release -warnaserror
          -p:ValheimManagedDir="$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed"
          -p:BepInExCoreDir="$RUNNER_TEMP/valheim-build-references/bepinex/core"
      - name: Test actual native camera and spline mathematics
        run: >-
          dotnet run --project tests/ValheimBroadcaster.Cinemachine.Tests
          --configuration Release -warnaserror
          -p:ValheimManagedDir="$RUNNER_TEMP/valheim-build-references/game/valheim_server_Data/Managed"
      - name: Stage client with its Cinemachine runtime and notices
        run: |
          mkdir -p artifacts/ValheimBroadcaster
          cp src/ValheimBroadcaster.Plugin/bin/Release/net48/ValheimBroadcaster.dll artifacts/ValheimBroadcaster/
          cp src/ValheimBroadcaster.Core/bin/Release/netstandard2.0/ValheimBroadcaster.Core.dll artifacts/ValheimBroadcaster/
          cp third_party/Cinemachine/bin/Release/net48/ValheimBroadcaster.Cinemachine.dll artifacts/ValheimBroadcaster/
          mkdir -p artifacts/ValheimBroadcaster/ThirdParty/Cinemachine
          cp third_party/Cinemachine/obj/upstream/LICENSE.md third_party/Cinemachine/obj/upstream/license.txt \
            "third_party/Cinemachine/obj/upstream/Third Party Notices.md" \
            third_party/Cinemachine/obj/upstream/package.json third_party/Cinemachine/obj/upstream/source-record.json \
            artifacts/ValheimBroadcaster/ThirdParty/Cinemachine/
          cp third_party/Cinemachine/README.md artifacts/ValheimBroadcaster/ThirdParty/Cinemachine/BUILD.md
          mkdir -p artifacts/ValheimBroadcaster/ThirdParty/Cinemachine/Splines
          cp third_party/Cinemachine/obj/upstream/Splines/LICENSE.md \
            third_party/Cinemachine/obj/upstream/Splines/package.json \
            third_party/Cinemachine/obj/upstream/Splines/source-record.json \
            artifacts/ValheimBroadcaster/ThirdParty/Cinemachine/Splines/
      - name: Upload test build (not a validated game release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valheim-broadcaster-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stage server companion separately
        run: |
          mkdir -p server-artifacts/ValheimBroadcaster
          cp src/ValheimBroadcaster.Server/bin/Release/net48/ValheimBroadcaster.Server.dll server-artifacts/ValheimBroadcaster/
          cp src/ValheimBroadcaster.Core/bin/Release/netstandard2.0/ValheimBroadcaster.Core.dll server-artifacts/ValheimBroadcaster/
      - name: Upload server test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valheim-broadcaster-server-${{ github.sha }}
          path: server-artifacts/
          if-no-files-found: error
          retention-days: 14
